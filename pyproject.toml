[project]
name = "pokemon-player"
version = "0.0.0"
description = "Research lab for a language-directed Pokemon Red agent."
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0",
    "pillow>=10",
    "pyboy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff==0.15.17",
]
rl = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "local_artifacts: requires ignored host artifacts such as ROMs, save states, screenshots, or run reports",
]

[tool.ruff]
line-length = 100
target-version = "py311"
