name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python and repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Validate portable metadata and repository hygiene
        run: python scripts/validate_repository.py
      - name: Lint
        run: python -m ruff check .
      - name: Run ROM-free tests
        run: python -m pytest -q -m "not local_artifacts"

  lab-ui:
    name: Lab UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lab-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/lab-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
